services:
  - type: web
    name: webbanhangreacjs
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm install -g serve && serve -s build -l 3000
    envVars:
      - key: NODE_VERSION
        value: 18.16.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024
